[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rg-tool-registry"
version = "1.0.0"
description = "Unified Tool Registry & Observability Module for the Resonant Genesis platform — 130+ tools, real-time metrics, native function calling, streaming."
readme = "README.md"
license = "LicenseRef-RG-Source-Available"
requires-python = ">=3.10"
authors = [
    { name = "Resonant Genesis", email = "dev@resonantgenesis.com" },
]
keywords = ["tools", "registry", "observability", "ai-agents", "function-calling", "metrics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
